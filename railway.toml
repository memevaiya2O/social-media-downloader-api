# Railway config — https://docs.railway.com/reference/config-as-code
# Deploy: railway up  OR  connect repo in Railway Dashboard → Deploy
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
