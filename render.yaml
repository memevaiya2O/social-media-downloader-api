# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push this repo to GitHub → Render Dashboard → New → Blueprint → select repo
services:
  - type: web
    name: social-downloader-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MAX_DURATION_SECONDS
        value: 3600
      - key: PYTHONUNBUFFERED
        value: 1
